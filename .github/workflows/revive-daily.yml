name: Revive daily (7/28 미색인분 되살리기)

# 왜: 2026-07-28 하루에 257편을 몰아 올려 33%만 색인됐다.
# 되살릴 때도 몰아서 밀면 같은 일이 반복되므로 **하루 N편**으로 끊어서 처리한다.
# 근거(2026-08-19 실측, 발행 후 7일 이상 지난 날만):
#   하루 1~3편 67% · 4~9편 79% · 257편 33%
#   (8/05 51편 92% 는 질병코드 사전 43편이라 기사형에 적용 못 함)
#   → 관측된 안전 구간 바로 위인 **하루 10편**으로 잡았다. 168편이면 17일.
#
# 이 워크플로가 하는 일은 기계적인 것만이다
#   · 카톡 상담 바 삽입 (168편 전부 없음 → 전부 실제 변경이 생긴다)
#   · <title> 브랜드 보정 · 수정일 갱신
#   · **실제로 바뀐 페이지만** sitemap lastmod 갱신
# 내용 보강은 사람이 한다. 이 잡은 최소한의 재크롤 신호까지만 책임진다.

on:
  schedule:
    - cron: '23 2 * * *'    # 02:23 UTC = 11:23 KST (index-submit 10:00 뒤)
  workflow_dispatch:
    inputs:
      count:
        description: '이번 실행에서 처리할 편수'
        required: false
        default: '10'
      dry_run:
        description: '1 이면 파일을 고치지 않고 대상만 출력'
        required: false
        default: '0'

concurrency:
  group: revive-daily
  cancel-in-progress: false

jobs:
  revive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 되살리기 배치
        id: run
        run: |
          cd scripts_temp/seo-guide
          if [ "${{ github.event.inputs.dry_run }}" = "1" ]; then
            python3 revive.py --run "${{ github.event.inputs.count || '10' }}" --dry | tee $GITHUB_STEP_SUMMARY
          else
            python3 revive.py --run "${{ github.event.inputs.count || '10' }}" | tee $GITHUB_STEP_SUMMARY
          fi

      - name: 커밋 & 푸시
        if: ${{ github.event.inputs.dry_run != '1' }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "villagebaby-revive-bot"
            git config user.email "bot@villagebaby.kr"
            git add -A
            git commit -m "chore(revive): 7/28 미색인분 되살리기 일일 배치"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          else
            echo "변경 없음 — 커밋 생략"
          fi
